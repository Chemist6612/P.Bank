<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kids Bank Ultimate - Cloud Edition</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <div class="container">
        <h1 class="title">🏦 Kids Bank Ultimate 🏦</h1>
        <button id="toggleTheme" class="toggle-theme">🌙 Toggle Dark Mode</button>

        <!-- Login Box -->
        <div class="panel" id="loginBox">
            <h2 class="subtitle">Login</h2>
            <select id="username">
                <option value="">Choose Account</option>
                <option value="Adam">Adam</option>
                <option value="Mhmd">Mhmd</option>
                <option value="Jwd">Jwd</option>
                <option value="Ali">Ali</option>
                <option value="Jawad">Jawad</option>
                <option value="Hsen">Hsen</option>
                <option value="Hanady">Hanady</option>
                <option value="Mr_Alireda">Mr.Alireda (Admin)</option>
            </select>
            <input type="password" id="password" placeholder="PIN">
            <button id="loginButton" class="action-btn">Login</button>
            <p class="signup-link">Don't have an account? <a href="https://forms.gle/ziCxEk2dNN3r8tBi8" target="_blank">Create one here</a>.</p>
        </div>

        <!-- User Dashboard -->
        <div class="panel hidden" id="dashboard">
            <h2 class="subtitle" id="welcome"></h2>
            <div class="balance-card">
                <h2>Balance</h2>
                <div class="balance" id="balance"></div>
                <div id="goldBalance"></div>
            </div>

            <div class="card" id="fakeCard"></div>
            <button id="claimReward" class="action-btn">🎁 Claim Daily $20</button>

            <h2 class="subtitle">Send Money</h2>
            <select id="transferUser"></select>
            <input type="number" id="transferAmount" placeholder="Amount">
            <button id="transferButton" class="action-btn">Send 💸</button>

            <div class="balance-card">
                <h2>🪙 Gold Wallet</h2>
                <input type="number" id="goldAmount" placeholder="Gold Amount">
                <button id="buyGoldButton" class="action-btn">Buy Gold</button>
                <p>1 Gold = $10</p>
            </div>

            <div id="qrcode"></div>
            <h2 class="subtitle">📷 QR Scanner</h2>
            <div id="reader" style="width:300px;"></div>

            <div class="transactions">
                <h2 class="subtitle">Transactions</h2>
                <div id="transactionList"></div>
            </div>

            <button id="printReceiptButton" class="action-btn">🖨️ Print Receipt</button>
            <button id="logoutButton" class="action-btn">Logout</button>
        </div>

        <!-- Admin Panel -->
        <div class="panel hidden" id="adminPanel">
            <h2 class="subtitle">👑 Admin Panel</h2>
            <select id="selectedKid"></select>
            <select id="receiverKid"></select>
            <input type="number" id="amount" placeholder="Amount">
            <select id="actionType">
                <option value="add">Give Reward</option>
                <option value="remove">Take Money</option>
                <option value="tax">Tax</option>
                <option value="transfer">Transfer Between Kids</option>
            </select>
            <input type="text" id="reason" placeholder="Reason">
            <button id="applyActionButton" class="action-btn">Apply</button>
            <div class="kid-grid" id="kidGrid"></div>
        </div>

        <!-- Receipt Popup -->
        <div id="receipt" class="receipt-popup hidden">
            <h2>🏦 Receipt</h2>
            <div id="receiptContent"></div>
            <button class="action-btn" onclick="closeReceipt()">Close</button>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
