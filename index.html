<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kids Bank Ultimate</title>
    
    <!-- Firebase Legacy SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <!-- QRCode Support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1 class="title">🏦 Kids Bank Ultimate 🏦</h1>
    <button class="mode-toggle" onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>

    <!-- Login Box -->
    <div class="login-box" id="loginBox">
        <h2 class="subtitle">Secure Login</h2>
        <!-- This status message tells you if Firebase is connected -->
        <div id="loadingStatus" style="background: #fff0f5; padding: 10px; border-radius: 10px; margin-bottom: 15px; color: #ff4fa3; font-weight: bold;">
            ⏳ Syncing with Cloud...
        </div>
        
        <select id="username" disabled>
            <option value="">-- Choose Your Name --</option>
            <option value="Adam">Adam</option>
            <option value="Mhmd">Mhmd</option>
            <option value="Jwd">Jwd</option>
            <option value="Ali">Ali</option>
            <option value="Jawad">Jawad</option>
            <option value="Hsen">Hsen</option>
            <option value="Hanady">Hanady</option>
            <option value="Mr.Alireda">Mr.Alireda (Admin)</option>
        </select>
        <input type="password" id="password" placeholder="4-Digit PIN">
        <button id="loginBtn" onclick="login()" disabled>Login to Vault</button>
    </div>

    <!-- Dashboard -->
    <div class="dashboard hidden" id="dashboard">
        <h2 class="subtitle" id="welcomeText"></h2>
        <div class="balance-card">
            <h3>Current Balance</h3>
            <div class="balance" id="balanceDisplay">$0</div>
            <div id="goldDisplay">🪙 Gold: 0</div>
        </div>
        <div class="card" id="fakeCard"></div>
        <button onclick="claimDailyReward()" class="action-btn">🎁 Claim Daily $20</button>
        <h3 class="subtitle">Recent Activity</h3>
        <div id="transactionList"></div>
        <button onclick="logout()" class="logout-btn">Logout</button>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel hidden" id="adminPanel">
        <h2 class="subtitle">👑 Vault Control</h2>
        <div id="kidGrid" class="kid-grid"></div>
        <button onclick="logout()" class="logout-btn">Exit Admin Mode</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
